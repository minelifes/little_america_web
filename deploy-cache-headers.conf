# Add inside your existing `server { ... }` block for the site,
# alongside wherever `root` and the SPA fallback (`try_files`) already are.

# 1) index.html — never let the browser/CDN cache this on its own.
#    Every deploy overwrites it with references to the new hashed bundle
#    filenames, so it must always be revalidated against the server.
location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
}

# 2) Hashed build output — safe to cache forever. The filename itself
#    (e.g. index-C1CocOc1.js) changes whenever the content changes, so a
#    long-lived cache can never serve a stale file under the same name.
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# If you don't already have a catch-all for the SPA, keep this too —
# unrelated to caching, but needed for client-side routing to work on
# a hard refresh/direct link to e.g. /account/orders.
# location / {
#     try_files $uri $uri/ /index.html;
# }
